
name: mlops-debit-sungai

services:
  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow

    image: lk09-mlflow-server:latest

    ports:
      - "127.0.0.1:5000:5000"

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlflow-data/artifacts
      - --allowed-hosts
      - mlflow-server:5000,localhost:5000,127.0.0.1:5000

    volumes:
      - mlflow-data:/mlflow-data

    networks:
      - mlops-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: lk09-api-service:latest

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000

    depends_on:
      mlflow-server:
        condition: service_healthy

    networks:
      - mlops-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  model-service:
    image: debit-sungai-mlflow-serving:latest

    expose:
      - "8080"

    deploy:
      replicas: 3

    networks:
      - mlops-network

    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-data:
    driver: local
