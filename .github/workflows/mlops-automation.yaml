name: MLOps Automation

on:
  push:
    branches:
      - main
      - feature/lk08-mlops-automation

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  automated-testing:
    name: Automated Testing (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          python -m pytest -v --junitxml=pytest-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lk08-pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 30  

  automated-training:
    name: Automated Training (DVC + MLflow)
    needs: automated-testing
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.SUPABASE_DB_URI }}
      MLFLOW_ARTIFACT_ROOT: s3://mlops-mlflow-artifacts/lk08-training
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      
      - name: Validate MLflow Connection Configuration
        run: |
          test -n "$MLFLOW_TRACKING_URI"
          test -n "$MLFLOW_S3_ENDPOINT_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          echo "MLflow connection configuration is available."

      - name: Configure DVC Supabase Remote
        env:
          SUPABASE_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          test -n "$SUPABASE_ENDPOINT"
          test -n "$SUPABASE_ACCESS_KEY"
          test -n "$SUPABASE_SECRET_KEY"

          dvc remote modify --local supabase endpointurl "$SUPABASE_ENDPOINT"
          dvc remote modify --local supabase access_key_id "$SUPABASE_ACCESS_KEY"
          dvc remote modify --local supabase secret_access_key "$SUPABASE_SECRET_KEY"
          dvc remote modify --local supabase region ap-northeast-1

      - name: Pull Dataset from DVC
        run: |
          dvc pull -r supabase data/processed.dvc
          ls -lh data/processed/
      
      - name: Run Automated Model Training
        run: |
          python src/train.py \
            --model rf \
            --n-estimators 200 \
            --max-depth 4 \
            --min-samples-leaf 1 \
            --seed 42 \
            --run-name lk08-ci-retraining \
            --run-id-file training-run-id.txt

      - name: Run Automated Model Evaluation
        run: |
          RUN_ID=$(cat training-run-id.txt)
          test -n "$RUN_ID"

          python src/evaluate_model.py \
            --run-id "$RUN_ID" \
            --tracking-uri "$MLFLOW_TRACKING_URI" \
            --config docs/lk08_evaluation_config.json \
            --output evaluation-result.json

      
      - name: Run Auto Registry Staging
        run: |
          python -m src.register_model \
            --evaluation-file evaluation-result.json \
            --config docs/lk08_evaluation_config.json \
            --output registration-result.json

      - name: Upload Registration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lk08-registration-results
          path: registration-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lk08-evaluation-results
          path: evaluation-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Training Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lk08-training-artifacts
          path: |
            training-run-id.txt
          if-no-files-found: warn
          retention-days: 30

